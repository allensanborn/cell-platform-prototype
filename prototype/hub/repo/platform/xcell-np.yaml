apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: crossplane-compose-hubcells
  labels: {rbac.crossplane.io/aggregate-to-crossplane: "true"}
  annotations: {argocd.argoproj.io/sync-wave: "-2"}
rules:
  - {apiGroups: [""], resources: [namespaces], verbs: ["*"]}
  - {apiGroups: [networking.k8s.io], resources: [networkpolicies], verbs: ["*"]}
---
apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: xcells.platform.example.org
  annotations: {argocd.argoproj.io/sync-wave: "-2"}
spec:
  scope: Cluster
  group: platform.example.org
  names: {kind: XCell, plural: xcells}
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                dependsOn: {type: array, items: {type: string}}
---
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: xcell-np
  labels: {channel: stable}
  annotations: {argocd.argoproj.io/sync-wave: "-1"}
spec:
  compositeTypeRef: {apiVersion: platform.example.org/v1alpha1, kind: XCell}
  mode: Pipeline
  pipeline:
    - step: render
      functionRef: {name: function-go-templating}
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            {{ $n := .observed.composite.resource.metadata.name }}
            ---
            apiVersion: v1
            kind: Namespace
            metadata:
              name: hub-{{ $n }}
              labels: {platform.example.org/hub-template: h2}
              annotations: {gotemplating.fn.crossplane.io/composition-resource-name: ns, gotemplating.fn.crossplane.io/ready: "True"}
            ---
            apiVersion: networking.k8s.io/v1
            kind: NetworkPolicy
            metadata:
              name: default-deny
              namespace: hub-{{ $n }}
              annotations: {gotemplating.fn.crossplane.io/composition-resource-name: deny, gotemplating.fn.crossplane.io/ready: "True"}
            spec: {podSelector: {}, policyTypes: [Ingress, Egress]}
    - step: auto-ready
      functionRef: {name: function-auto-ready}
