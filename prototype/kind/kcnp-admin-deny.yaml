apiVersion: policy.networking.k8s.io/v1alpha2
kind: ClusterNetworkPolicy
metadata: {name: platform-deny-b-to-a}
spec:
  tier: Admin
  priority: 10
  subject:
    namespaces: {matchLabels: {cell: b}}
  egress:
    - name: deny-b-to-a
      action: Deny
      to: [{namespaces: {matchLabels: {cell: a}}}]
