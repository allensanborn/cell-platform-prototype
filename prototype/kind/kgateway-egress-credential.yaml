# South door with credential injection: kgateway v2.5.2 egress Gateway adds X-Api-Key from a Secret.
apiVersion: v1
kind: Namespace
metadata: {name: kgw-egress}
---
apiVersion: v1
kind: Secret
metadata: {name: httpbin-api-key, namespace: kgw-egress}
stringData: {X-Api-Key: proto-not-a-real-key-0001}
---
apiVersion: gateway.kgateway.dev/v1alpha1
kind: Backend
metadata: {name: httpbin, namespace: kgw-egress}
spec:
  type: Static
  static:
    hosts: [{host: httpbin.org, port: 80}]
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata: {name: egress, namespace: kgw-egress}
spec:
  gatewayClassName: kgateway
  listeners: [{name: http, port: 8080, protocol: HTTP, allowedRoutes: {namespaces: {from: Same}}}]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: httpbin, namespace: kgw-egress}
spec:
  parentRefs: [{name: egress}]
  hostnames: [api.httpbin.test]
  rules:
    - filters: [{type: URLRewrite, urlRewrite: {hostname: httpbin.org}}]
      backendRefs: [{group: gateway.kgateway.dev, kind: Backend, name: httpbin}]
---
apiVersion: gateway.kgateway.dev/v1alpha1
kind: TrafficPolicy
metadata: {name: inject-api-key, namespace: kgw-egress}
spec:
  targetRefs: [{group: gateway.networking.k8s.io, kind: HTTPRoute, name: httpbin}]
  headerModifiers:
    request:
      set: [{name: X-Api-Key, secretRef: {name: httpbin-api-key, key: X-Api-Key}}]
