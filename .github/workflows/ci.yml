# This repo ships manifests, scripts and write-ups, no compiled code. These checks are its test suite.
name: ci
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0 # gitleaks scans history
          persist-credentials: false
      - name: shellcheck
        run: git ls-files -z '*.sh' | xargs -0 shellcheck -S warning
      - name: gitleaks (full history)
        run: >-
          docker run --rm -v "$PWD:/src" -w /src
          zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git --no-banner --redact .
      - name: trivy (vulnerabilities, secrets, misconfiguration)
        run: >-
          docker run --rm -v "$PWD:/src:ro" -w /src
          aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb
          fs --scanners vuln,secret,misconfig --ignorefile .trivyignore.yaml
          --exit-code 1 --severity HIGH,CRITICAL --quiet .
  # Every commit must carry a Developer Certificate of Origin sign-off (CONTRIBUTING.md).
  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Signed-off-by on every commit
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          fail=0
          for c in $(git rev-list --no-merges "$BASE..$HEAD"); do
            git log -1 --format=%B "$c" | grep -Eq '^Signed-off-by: .+ <.+>$' ||
              { echo "missing Signed-off-by: $(git log -1 --format='%h %s' "$c")"; fail=1; }
          done
          exit "$fail"
